spring.application.name=nexcart-backend

# =====================================================
# POSTGRESQL
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/nexcart
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:@rushi}


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =====================================================
# SERVER
# =====================================================

server.port=8081


# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET:nexcart_super_secret_jwt_key_2026_spring_boot_jwt_token_must_be_32_bytes_long}
jwt.expiration=86400000


# =====================================================
# ADMIN
# =====================================================

ADMIN_EMAIL=admin@nexcart.com


# =====================================================
# PASSWORD RESET
# =====================================================

app.frontend-url=http://localhost:5173


# =====================================================
# GMAIL SMTP
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:admin@nexcart.com}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# =====================================================
# RAZORPAY
# =====================================================

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}


# =====================================================
# OPENAI AI CHATBOT
# =====================================================

openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}